[package]
name = "server_rust"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.60", features = ["derive"] }
futures-channel = "0.3.32"
futures-util = "0.3.32"
parking_lot = "0.12.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full"] }
tokio-tungstenite = "0.28.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
uuid = { version = "1.21.0", features = ["v4"] }
virtual_gamepad = { git="https://github.com/RylanYancey/virtual-gamepad.git", features=["serde"] }




[dev-dependencies]
getrandom = "0.4.2"
